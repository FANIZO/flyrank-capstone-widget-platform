services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: widget_platform
      POSTGRES_USER: widget_user
      POSTGRES_PASSWORD: widget_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget_user -d widget_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro

  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://widget_user:widget_password@db:5432/widget_platform}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      GEO_PROVIDER_A_MODE: ${GEO_PROVIDER_A_MODE:-success}
      GEO_PROVIDER_B_MODE: ${GEO_PROVIDER_B_MODE:-success}
      SIDE_EFFECT_FORCE_FAILURE: ${SIDE_EFFECT_FORCE_FAILURE:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
