run: docker compose up --build
seed: docker compose exec app python -m app.seed
test: docker compose exec app pytest -q
base_url: http://localhost:8000
endpoints:
  health: /health
  signup: /auth/signup
  login: /auth/login
  widgets: /widgets
  public_config: /public/widgets/{public_id}/config
  submission: /public/widgets/{public_id}/submissions
  dashboard_submissions: /dashboard/submissions
  dashboard_stats: /dashboard/stats
